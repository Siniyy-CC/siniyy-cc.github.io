name: Bootstrap SetsuLand

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import SetsuLand source
        shell: bash
        run: |
          base64 --decode setsuland-source.zip.b64 > setsuland-source.zip
          echo "531d2a4160f4d2d8ea491f9aaa5f9adc868d0e3f7912a9f2d30581722627fcdb  setsuland-source.zip" | sha256sum --check

          source_dir="$(mktemp -d)"
          unzip -q setsuland-source.zip -d "$source_dir"
          rm setsuland-source.zip setsuland-source.zip.b64

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find "$source_dir" -mindepth 1 -maxdepth 1 ! -name .github -exec cp -a {} . \;
          find . -type f -not -path './.git/*' -exec chmod 644 {} +
          find . -type d -not -path './.git*' -exec chmod 755 {} +

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish SetsuLand"
          git push
