<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-Hant' }}">

  {% include head.html %}

  <body class="theme-base-{{ site.color-scheme }}">

    {% if page.toc %}
      {% include sidebar-toc.html %}
    {% else %}
      {% include sidebar.html %}
    {% endif %}

    <div class="wrap">
      <button class="sidebar-toggle"
          aria-label="開啟導覽選單"
          aria-expanded="false"
          aria-controls="sidebar">
      </button>
      <header class="masthead">
        <div class="container">
          <h3 class="masthead-title">
            <a href="{{ '/' | relative_url }}" title="首頁">{{ site.title | newline_to_br }}</a>
            <br><small>{{ site.tagline }}</small>
          </h3>
        </div>
      </header>

      <main class="container content" id="main">
        {{ content }}
      </main>
    </div>

    <script>
      (function(document) {
        var toggle = document.querySelector('.sidebar-toggle');
        var sidebar = document.querySelector('#sidebar');
        var checkbox = document.querySelector('#sidebar-checkbox');
        var firstLink = sidebar && sidebar.querySelector('.sidebar-nav-item');

        if (!toggle || !sidebar || !checkbox) return;

        toggle.addEventListener('click', function(event) {
          event.preventDefault();
          checkbox.checked = !checkbox.checked;
          toggle.setAttribute('aria-expanded', String(checkbox.checked));
          sidebar.setAttribute('aria-hidden', String(!checkbox.checked));
          if (checkbox.checked && firstLink) firstLink.focus();
        });

        sidebar.addEventListener('click', function(event) {
          if (!event.target.closest('a')) return;
          checkbox.checked = false;
          toggle.setAttribute('aria-expanded', 'false');
          sidebar.setAttribute('aria-hidden', 'true');
        });

        document.addEventListener('keydown', function(event) {
          if (event.key !== 'Escape' || !checkbox.checked) return;
          checkbox.checked = false;
          toggle.setAttribute('aria-expanded', 'false');
          sidebar.setAttribute('aria-hidden', 'true');
          toggle.focus();
        });
      })(document);
    </script>
  </body>
</html>
